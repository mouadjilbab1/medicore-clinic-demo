services:
  - type: web
    name: medicore-clinic-demo
    runtime: php
    plan: free
    region: frankfurt
    buildCommand: |
      composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
      npm install
      npm run build
      touch database/database.sqlite
      php artisan key:generate --force
      php artisan migrate:fresh --seed --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
